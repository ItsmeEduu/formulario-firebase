<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cadastro Banco de Dados</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card">
    <h1>Formulário de Depósito</h1>

    <form id="formulario">
      <div class="campo">
        <label for="nome">Nome</label>
        <div class="entrada">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.2 18.2c1.4-2.3 3.4-3.4 5.8-3.4s4.4 1.1 5.8 3.4"/></svg>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" autocomplete="name" required>
        </div>
      </div>

      <div class="campo">
        <label for="email">E-mail</label>
        <div class="entrada">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3.5 6.5 12 13l8.5-6.5"/></svg>
          <input type="email" id="email" name="email" placeholder="Digite seu e-mail" autocomplete="email" required>
        </div>
      </div>

      <div class="campo">
        <label for="valor">Valor do depósito (R$)</label>
        <div class="entrada">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M14.6 9.2c-.4-.8-1.3-1.2-2.6-1.2-1.5 0-2.5.7-2.5 1.8 0 2.7 5.2 1.2 5.2 3.9 0 1.2-1.1 2-2.7 2-1.4 0-2.4-.5-2.9-1.4M12 6.5V8m0 8v1.5"/></svg>
          <input type="number" id="valor" name="valor" placeholder="R$ 0,00" min="0.01" step="0.01" inputmode="decimal" required>
        </div>
      </div>

      <button type="submit" class="botao">Enviar dados</button>
    </form>
  </main>

  <!-- Seu script do Firebase (precisa ser módulo) -->
  <script type="module" src="script.js"></script>
</body>
</html>
